<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ProdClin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233D1636'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='36' font-weight='700' fill='%23F6ECF2' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<div id="barra-progresso-topo"><div class="filete"></div></div>


<!-- ===================== TELA DE LOGIN ===================== -->
<div id="tela-login">
  <div class="cartao-login">
    <div class="marca-login">
      <div class="selo" id="selo-login">C</div>
      <h1>ProdClin</h1>
      <p id="subtitulo-login">Acesso restrito à equipe da clínica</p>
    </div>
    <form id="form-login">
      <div class="campo">
        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" autocomplete="username" required />
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" autocomplete="current-password" required />
      </div>
      <button type="submit" class="botao largo">Entrar</button>
      <div id="erro-login"></div>
    </form>
    <div class="contas-demo" id="contas-demo"></div>
  </div>
</div>


<!-- ===================== APLICAÇÃO ===================== -->
<div id="app">
  <div id="faixa-demo" style="display:none;">MODO DEMONSTRAÇÃO — configure SUPABASE_URL e SUPABASE_ANON_KEY para usar dados reais</div>
  <header class="topo">
    <div class="marca-topo">
      <div class="selo" id="selo-topo">C</div>
      <div>
        <h2>ProdClin</h2>
        <span id="nome-clinica-topo">Clínica</span>
      </div>
    </div>
    <nav class="abas" id="nav-abas"></nav>
    <div class="info-usuario">
      <span>Logado como <b id="nome-usuario-topo"></b></span>
      <button class="botao sutil pequeno" id="botao-minha-conta">Minha conta</button>
      <button class="botao sutil pequeno" id="botao-sair">Sair</button>
    </div>
  </header>


  <main>
    <!-- ---------- INÍCIO (sem filtro — hoje e mês atual, sempre) ---------- -->
    <div id="painel-inicio-slot" data-fragmento="html/inicio.html"></div>


    <!-- ---------- LANÇAMENTO ---------- -->
    <div id="painel-lancamento-slot" data-fragmento="html/lancamento.html"></div>


    <!-- ---------- GERENCIAL ---------- -->
    <!-- ---------- VERIFICAÇÃO (Verificar + Crítica, em sub-abas) ---------- -->
    <div id="painel-verificacao-slot" data-fragmento="html/verificacao.html"></div>


    <!-- ---------- DASHBOARD (Análises + RMR + Metas, em sub-abas) ---------- -->
    <div id="painel-dashboard-slot" data-fragmento="html/dashboard.html"></div>


    <div id="painel-financeiro-slot" data-fragmento="html/financeiro.html"></div>


    <!-- ---------- ESTOQUE ---------- -->
    <div id="painel-estoque-slot" data-fragmento="html/estoque.html"></div>


    <!-- ---------- CONFIGURAÇÕES ---------- -->
    <div id="painel-configuracoes-slot" data-fragmento="html/configuracoes.html"></div>
  </main>
  <footer class="rodape-sistema">
    <span>ProdClin <b id="versao-sistema">v6.31.4</b></span>
    <span class="separador-rodape">•</span>
    <span>Desenvolvido por <b>DSP Group</b></span>
  </footer>
</div>


<!-- ===================== MODAL DE EDIÇÃO ===================== -->
<div id="modais-slot" data-fragmento="html/modais.html"></div>


<script>
// Carregador de fragmentos + scripts, em 2 etapas obrigatórias nessa ordem:
// 1) busca cada html/*.html (data-fragmento) e injeta no slot correspondente
//    — TODOS os painéis/modais precisam existir no DOM antes de qualquer
//    script do app rodar, porque vários arquivos fazem
//    document.getElementById(...).addEventListener(...) direto no
//    carregamento (fora de função), sem esperar nada.
// 2) só depois disso, carrega os scripts do app em sequência (não em
//    paralelo — a ordem importa, sessao-login.js precisa ser o último).
async function carregarFragmentosHtml(){
  const slots = document.querySelectorAll('[data-fragmento]');
  await Promise.all(Array.from(slots).map(async slot=>{
    const resp = await fetch(slot.dataset.fragmento);
    if(!resp.ok) throw new Error(`Não consegui carregar ${slot.dataset.fragmento} (HTTP ${resp.status})`);
    slot.outerHTML = await resp.text();
  }));
}

function carregarScriptsEmSequencia(lista){
  return lista.reduce((promessaAnterior, src) => promessaAnterior.then(()=> new Promise((resolve, reject)=>{
    const el = document.createElement('script');
    el.src = src;
    el.onload = resolve;
    el.onerror = () => reject(new Error(`Não consegui carregar ${src}`));
    document.body.appendChild(el);
  })), Promise.resolve());
}

carregarFragmentosHtml()
  .then(() => carregarScriptsEmSequencia([
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
    'js/config.js',
    'js/estado.js',
    'js/dados-demo.js',
    'js/api.js',
    'js/graficos.js',
    'js/inicio.js',
    'js/app-init.js',
    'js/lancamento.js',
    'js/verificar.js',
    'js/critica.js',
    'js/metas.js',
    'js/configuracoes.js',
    'js/modal.js',
    'js/analises.js',
    'js/apresentacao.js',
    'js/financeiro.js',
    'js/estoque.js',
    'js/rmr-squad.js',
    'js/sessao-login.js' // precisa ser o último — roda código imediatamente ao carregar
  ]))
  .catch(erro=>{
    console.error(erro);
    document.body.insertAdjacentHTML('afterbegin', `<div style="background:#fee;color:#900;padding:16px;font-family:monospace;">Erro ao carregar o sistema: ${erro.message}</div>`);
  });
</script>
</body>
</html>
