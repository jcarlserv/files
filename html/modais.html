<div class="sobreposicao" id="sobreposicao-modal">
  <div class="modal">
    <h3 id="titulo-modal">Editar registro</h3>
    <form id="form-modal">
      <div class="grade-form" id="grade-modal"></div>
      <div class="modal-acoes">
        <button type="button" class="botao perigo" id="botao-excluir-modal" style="margin-right:auto;">Excluir</button>
        <button type="button" class="botao sutil" id="botao-cancelar-modal">Cancelar</button>
        <button type="submit" class="botao">Salvar alterações</button>
      </div>
    </form>
  </div>
</div>

<div class="sobreposicao" id="sobreposicao-modal-paciente">
  <div class="modal">
    <h3 id="titulo-modal-paciente">Novo paciente</h3>
    <form id="form-modal-paciente">
      <div class="grade-form">
        <div class="campo" style="grid-column:1/-1;"><label>Nome completo *</label><input type="text" id="modal-paciente-nome" required></div>
        <div class="campo"><label>WhatsApp</label><input type="text" id="modal-paciente-whatsapp" placeholder="(00) 00000-0000"></div>
        <div class="campo"><label>Endereço</label><input type="text" id="modal-paciente-endereco"></div>
        <div class="campo"><label>Convênio</label><select id="modal-paciente-convenio"><option value="">—</option></select></div>
        <div class="campo"><label>Carteirinha</label><input type="text" id="modal-paciente-carteirinha"></div>
        <div class="campo"><label>Data de nascimento</label><input type="date" id="modal-paciente-data-nascimento"></div>
        <div class="campo"><label>CPF</label><input type="text" id="modal-paciente-cpf" placeholder="000.000.000-00"></div>
      </div>
      <div class="modal-acoes">
        <button type="button" class="botao sutil" id="botao-cancelar-modal-paciente">Cancelar</button>
        <button type="submit" class="botao">Salvar paciente</button>
      </div>
    </form>
  </div>
</div>

<div class="sobreposicao" id="sobreposicao-modal-fornecedor">
  <div class="modal">
    <h3 id="titulo-modal-fornecedor">Novo fornecedor</h3>
    <form id="form-modal-fornecedor">
      <div class="grade-form">
        <div class="campo" style="grid-column:1/-1;"><label>Nome *</label><input type="text" id="modal-fornecedor-nome" required></div>
        <div class="campo"><label>CNPJ</label><input type="text" id="modal-fornecedor-cnpj" placeholder="00.000.000/0000-00"></div>
        <div class="campo"><label>Contato</label><input type="text" id="modal-fornecedor-contato" placeholder="Telefone ou e-mail"></div>
      </div>
      <div class="modal-acoes">
        <button type="button" class="botao sutil" id="botao-cancelar-modal-fornecedor">Cancelar</button>
        <button type="submit" class="botao">Salvar fornecedor</button>
      </div>
    </form>
  </div>
</div>

<div class="sobreposicao" id="sobreposicao-modal-material">
  <div class="modal">
    <h3 id="titulo-modal-material">Novo material</h3>
    <form id="form-modal-material">
      <div class="grade-form">
        <div class="campo" style="grid-column:1/-1;"><label>Nome *</label><input type="text" id="modal-material-nome" required></div>
        <div class="campo"><label>Categoria</label><input type="text" id="modal-material-categoria" placeholder="Ex.: Descartável, EPI, Curativo"></div>
        <div class="campo"><label>Unidade</label><input type="text" id="modal-material-unidade" placeholder="unidade, caixa, par..."></div>
        <div class="campo"><label>Estoque mínimo</label><input type="number" id="modal-material-estoque-minimo" step="1"></div>
        <div class="campo"><label style="display:flex;align-items:center;gap:8px;cursor:pointer;"><input type="checkbox" id="modal-material-ativo" checked style="width:auto;"> Ativo</label></div>
      </div>
      <div class="modal-acoes">
        <button type="button" class="botao sutil" id="botao-cancelar-modal-material">Cancelar</button>
        <button type="submit" class="botao">Salvar material</button>
      </div>
    </form>
  </div>
</div>

<div class="sobreposicao" id="sobreposicao-conta">
  <div class="modal" style="max-width:420px;">
    <h3>Minha conta</h3>
    <form id="form-conta">
      <div class="campo">
        <label>Nome exibido</label>
        <input type="text" id="conta-nome" required />
      </div>
      <div class="campo">
        <label>Senha atual</label>
        <input type="password" id="conta-senha-atual" autocomplete="current-password" required />
      </div>
      <div class="campo">
        <label>Nova senha (deixe em branco para não trocar)</label>
        <input type="password" id="conta-nova-senha" autocomplete="new-password" />
      </div>
      <div class="campo">
        <label>Confirmar nova senha</label>
        <input type="password" id="conta-confirmar-senha" autocomplete="new-password" />
      </div>
      <div id="conta-mensagem" style="font-size:13px;min-height:18px;margin-bottom:6px;"></div>
      <div class="modal-acoes">
        <button type="button" class="botao sutil" id="botao-cancelar-conta">Cancelar</button>
        <button type="submit" class="botao">Salvar</button>
      </div>
    </form>
  </div>
</div>

<div class="sobreposicao" id="sobreposicao-apresentacao">
  <div class="apresentacao-modal-conteudo">
    <div id="apresentacao-stage-wrap">
      <div style="display:flex;justify-content:flex-end;gap:10px;margin-bottom:10px;">
        <button class="botao sutil pequeno" id="apresentacao-botao-tela-cheia">Tela cheia</button>
        <button class="botao sutil pequeno" id="apresentacao-botao-exportar-pdf">Exportar PDF</button>
        <button class="botao sutil pequeno" id="apresentacao-botao-fechar">Fechar ×</button>
      </div>
      <div id="apresentacao-stage"><p class="vazio">Carregando...</p></div>
      <div id="apresentacao-navegacao">
        <button class="botao sutil pequeno" id="apresentacao-anterior">← Anterior</button>
        <span id="apresentacao-indicador" class="mono">1 / 1</span>
        <button class="botao sutil pequeno" id="apresentacao-proxima">Próxima →</button>
      </div>
    </div>
  </div>
</div>
